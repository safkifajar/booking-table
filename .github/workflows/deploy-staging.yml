name: Deploy Staging

# Auto-deploy setiap push ke branch `staging`.
# Build dijalankan DI VPS (via SSH), bukan di runner GitHub — jadi kuota
# GitHub Actions nyaris tak terpakai (job cuma "SSH lalu jalankan script").
on:
  push:
    branches: [staging]
  workflow_dispatch: {} # bisa trigger manual dari tab Actions

# Batalkan run lama kalau ada push baru ke staging (hindari deploy tumpang-tindih).
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Secret tidak bisa dipakai di `if` job-level, jadi diangkat ke output dulu.
      # Kalau VPS_HOST belum diisi (VPS belum ada) → step deploy di-skip,
      # job tetap HIJAU (bukan gagal merah).
      - name: Cek secret VPS
        id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secret VPS belum diisi — deploy di-skip. Isi VPS_HOST/VPS_USER/VPS_SSH_KEY di Settings > Secrets untuk mengaktifkan."
          fi

      - name: Deploy ke VPS (staging)
        id: deploy
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # port: 22   # uncomment kalau SSH pakai port non-standar (tambah secret VPS_SSH_PORT)
          script_stop: true
          # VPS Hostinger kadang lambat merespons handshake SSH → "i/o timeout".
          # timeout = batas CONNECT (perlonggar dr 30s default → 120s beri napas
          # saat VPS lambat). command_timeout = batas eksekusi script (build lama).
          timeout: 120s
          command_timeout: 20m
          script: |
            cd /home/booking/soho-staging
            ./scripts/deploy.sh staging

      # Coba ULANG kalau attempt pertama gagal (biasanya i/o timeout sesaat) —
      # jadi tak perlu Re-run manual. deploy.sh idempotent, aman diulang.
      - name: Deploy ulang (retry) — staging
        if: steps.check.outputs.ready == 'true' && steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          timeout: 120s
          command_timeout: 20m
          script: |
            cd /home/booking/soho-staging
            ./scripts/deploy.sh staging

      # ── Notifikasi Telegram (butuh secret TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID).
      #    Kalau secret kosong, step di-skip diam-diam (tak menggagalkan job).
      - name: Notif Telegram — sukses
        if: success() && steps.check.outputs.ready == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TG_TOKEN" ] && { echo "TELEGRAM secret kosong — skip"; exit 0; }
          TEXT=$(printf '%s\n%s\n%s\n%s' \
            "✅ <b>Staging</b> deployed" \
            "<b>Commit:</b> $COMMIT_MSG" \
            "<b>By:</b> $ACTOR" \
            "<a href=\"$RUN_URL\">Lihat run</a>")
          RESP=$(curl -sS --max-time 20 \
            "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode text="$TEXT")
          echo "Telegram response: $RESP"
          echo "$RESP" | grep -q '"ok":true' || echo "::warning::Telegram menolak pesan — cek TELEGRAM_CHAT_ID/TOKEN. Respons: $RESP"

      - name: Notif Telegram — gagal
        if: failure() && steps.check.outputs.ready == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TG_TOKEN" ] && { echo "TELEGRAM secret kosong — skip"; exit 0; }
          TEXT=$(printf '%s\n%s\n%s\n%s' \
            "❌ <b>Staging</b> deploy GAGAL" \
            "<b>Commit:</b> $COMMIT_MSG" \
            "<b>By:</b> $ACTOR" \
            "<a href=\"$RUN_URL\">Cek error</a>")
          RESP=$(curl -sS --max-time 20 \
            "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode text="$TEXT")
          echo "Telegram response: $RESP"
          echo "$RESP" | grep -q '"ok":true' || echo "::warning::Telegram menolak pesan — cek TELEGRAM_CHAT_ID/TOKEN. Respons: $RESP"
