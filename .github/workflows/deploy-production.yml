name: Deploy Production

# Auto-deploy setiap push/merge ke branch `main`.
# Migrasi DB OTOMATIS (db:push --force) tapi DIDAHULUI backup pg_dump —
# lihat scripts/deploy.sh. Backup tersimpan di ~/backups/ di VPS (14 hari).
# Kalau ada masalah, restore: gunzip < backup.sql.gz | psql "$DATABASE_URL"
on:
  push:
    branches: [main]
  workflow_dispatch: {} # bisa trigger manual dari tab Actions

# Batalkan run lama kalau ada push baru ke main.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Secret tidak bisa dipakai di `if` job-level, jadi diangkat ke output dulu.
      # Kalau VPS_HOST belum diisi (VPS belum ada) → step deploy di-skip,
      # job tetap HIJAU (bukan gagal merah).
      - name: Cek secret VPS
        id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secret VPS belum diisi — deploy di-skip. Isi VPS_HOST/VPS_USER/VPS_SSH_KEY di Settings > Secrets untuk mengaktifkan."
          fi

      - name: Deploy ke VPS (production)
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # port: 22   # uncomment kalau SSH pakai port non-standar (tambah secret VPS_SSH_PORT)
          script_stop: true
          script: |
            cd /home/booking/soho-prod
            ./scripts/deploy.sh production
