<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6c478"/>
      <stop offset="50%" stop-color="#c9a961"/>
      <stop offset="100%" stop-color="#a8893f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="65%">
      <stop offset="40%" stop-color="#c9a961" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c9a961" stop-opacity="0.18"/>
    </radialGradient>
  </defs>

  <!-- iOS akan auto-mask jadi rounded square, jadi tidak perlu rx -->
  <rect width="180" height="180" fill="#0a0a0a"/>
  <rect width="180" height="180" fill="url(#halo)"/>

  <!-- decorative ring -->
  <circle cx="90" cy="90" r="62" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.35"/>

  <!-- larger stylised S, centered -->
  <path
    d="M 115 62
       C 115 53.71 103.81 47 90 47
       C 76.19 47 65 53.71 65 62
       C 65 70.29 76.19 77 90 77
       C 103.81 77 115 83.71 115 92
       C 115 100.29 103.81 107 90 107
       C 76.19 107 65 100.29 65 92
       M 65 92
       L 65 118
       C 65 126.29 76.19 133 90 133
       C 103.81 133 115 126.29 115 118"
    fill="none"
    stroke="url(#gold)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- tiny "SOHO" tagline -->
  <text
    x="90"
    y="158"
    text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="9"
    font-weight="600"
    letter-spacing="3"
    fill="#c9a961"
    opacity="0.7"
  >SOHO</text>
</svg>
